location = /atlas {
    return 308 /atlas/;
}

location ^~ /atlas/assets/ {
    root /srv/atlas-portal/current;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location ^~ /atlas/ {
    root /srv/atlas-portal/current;
    try_files $uri $uri/ /atlas/index.html;
}
